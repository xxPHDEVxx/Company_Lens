# Render Blueprint for Company Lens
# Deploy with: Connect GitHub repo → Blueprint → Auto-deploy

databases:
  - name: company-lens-db
    databaseName: company_lens
    user: company_lens_user
    plan: free

services:
  # Redis Cache
  - type: redis
    name: company-lens-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # Django Backend API
  - type: web
    name: company-lens-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: company-lens-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LOAD_DEMO_DATA
        value: "true"

  # Django Celery Worker (handles default and priority queues)
  # NOTE: Running as web service for free tier compatibility
  - type: web
    name: company-lens-celery-worker
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile.worker
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: company-lens-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WORKER_TYPE
        value: "django"

  # AI Celery Worker (handles scraper queue with ML dependencies)
  # NOTE: Running as web service for free tier compatibility
  - type: web
    name: company-lens-ai-worker
    env: docker
    plan: free
    dockerfilePath: ./ai/Dockerfile.worker
    dockerContext: ./ai
    healthCheckPath: /health
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: AZURE_MAPS_SUBSCRIPTION_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGSMITH_ENDPOINT
        value: "https://eu.api.smith.langchain.com"
      - key: LANGCHAIN_PROJECT
        value: "Company Lens - Production"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: environment
        value: "Production"
      - key: WORKER_TYPE
        value: "ai"

  # Weekly Company Data Refresh Cron Job
  - type: cron
    name: company-lens-weekly-refresh
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    schedule: "0 3 * * 0"  # Every Sunday at 3 AM UTC
    dockerCommand: python manage.py refresh_companies --older-than-days=7
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: company-lens-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # React Frontend
  - type: web
    name: company-lens-frontend
    env: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: company-lens-backend
          envVarKey: RENDER_EXTERNAL_URL
