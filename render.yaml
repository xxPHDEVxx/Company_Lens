# Render Blueprint for Company Lens
# Deploy with: Connect GitHub repo → Blueprint → Auto-deploy

databases:
  - name: company-lens-db
    databaseName: company_lens
    user: company_lens_user
    plan: free

services:
  # Redis Cache
  - type: redis
    name: company-lens-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # Django Backend API
  - type: web
    name: company-lens-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: company-lens-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LOAD_DEMO_DATA
        value: "true"

  # Celery Worker
  - type: worker
    name: company-lens-celery-worker
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A company_lens worker --loglevel=info --concurrency=1 --queues=default,scraper,priority
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: company-lens-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: company-lens-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # React Frontend
  - type: web
    name: company-lens-frontend
    env: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: company-lens-backend
          envVarKey: RENDER_EXTERNAL_URL
